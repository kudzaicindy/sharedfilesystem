# Fly.io — OnlyOffice Document Server (recommended for public HTTPS URL)
# See deploy/onlyoffice/README.txt for setup steps.

app = 'shared-docs-onlyoffice'
primary_region = 'fra'

[build]
  image = 'onlyoffice/documentserver:8.2.2'

[env]
  JWT_ENABLED = 'true'
  JWT_HEADER = 'Authorization'

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = '4gb'
  cpu_kind = 'shared'
  cpus = 2
