services:
  onlyoffice:
    image: onlyoffice/documentserver:8.2.2
    container_name: alamait-onlyoffice
    restart: unless-stopped
    mem_limit: 4g
    ports:
      - "8082:80"
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: "${ONLYOFFICE_JWT_SECRET:-change-me}"
      JWT_HEADER: "Authorization"
